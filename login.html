<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login Administrator OpenDesa Way Ilahan" />
  <title>Login Admin - OpenDesa Way Ilahan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="card-title mb-3">Login Akun Desa</h4>
            <p class="text-muted">Masuk menggunakan akun warga untuk mengakses informasi desa. Jika Anda admin, gunakan akun admin untuk mengelola data.</p>
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="admin@wayilahan.id" required />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="********" required />
              </div>
              <button type="submit" class="btn btn-success w-100">Masuk</button>
            </form>
            <div id="loginAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
            <div class="mt-3 text-center">
              <p class="small mb-1">Belum punya akun? <a href="register.html">Daftar akun warga</a></p>
              <a href="index.html">Kembali ke Beranda</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebase/firebase-config.js"></script>
  <script src="firebase/auth.js"></script>
  <script>
    redirectIfAuthenticated();
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('loginAlert');
      alertBox.classList.add('d-none');

      // Basic client-side validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alertBox.textContent = 'Masukkan email yang valid.';
        alertBox.classList.remove('d-none');
        return;
      }
      if (!password || password.length < 6) {
        alertBox.textContent = 'Password minimal 6 karakter.';
        alertBox.classList.remove('d-none');
        return;
      }

      // Check Firebase config / mock availability
      if (typeof isFirebaseConfigValid === 'function' && !isFirebaseConfigValid() && !window.__FIREBASE_MOCK) {
        alertBox.textContent = 'Layanan auth belum tersedia (Firebase belum dikonfigurasi). Hubungi administrator atau gunakan mode pengembangan.';
        alertBox.classList.remove('d-none');
        return;
      }

      try {
        const result = await signIn(email, password);
        if (typeof isAdminUser === 'function' && isAdminUser(result.user)) {
          window.location.href = 'admin/dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (error) {
        if (error && error.code === 'auth/invalid-api-key') {
          alertBox.textContent = 'Firebase belum dikonfigurasi dengan API key yang valid. Untuk pengembangan gunakan mock atau isi konfigurasi Firebase.';
        } else {
          alertBox.textContent = (error && error.message) ? error.message : 'Login gagal. Periksa kembali kredensial Anda.';
        }
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
