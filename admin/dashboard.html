<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin - OpenDesa Way Ilahan</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">Admin OpenDesa</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-controls="adminNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="penduduk.html">Penduduk</a></li>
          <li class="nav-item"><a class="nav-link" href="apbdes.html">APBDes</a></li>
          <li class="nav-item"><a class="nav-link" href="berita.html">Berita</a></li>
          <li class="nav-item"><a class="nav-link" href="pengumuman.html">Pengumuman</a></li>
          <li class="nav-item"><a class="nav-link" href="galeri.html">Galeri</a></li>
          <li class="nav-item"><a class="nav-link" href="dokumen.html">Dokumen</a></li>
          <li class="nav-item"><a class="nav-link" href="pengaduan.html">Pengaduan</a></li>
          <li class="nav-item"><a class="nav-link" href="pengguna.html">Pengguna</a></li>
          <li class="nav-item"><a class="nav-link" href="pengaturan.html">Pengaturan</a></li>
        </ul>
        <button id="logoutBtn" class="btn btn-outline-light">Keluar</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1>Dashboard Admin</h1>
        <p class="text-muted">Ringkasan statistik desa dan aktivitas terbaru.</p>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-3"><div class="card shadow-sm p-4"><h5>Jumlah Penduduk</h5><p class="fs-3" id="adminTotalPenduduk">0</p></div></div>
      <div class="col-md-3"><div class="card shadow-sm p-4"><h5>Dokumen</h5><p class="fs-3" id="adminTotalDokumen">0</p></div></div>
      <div class="col-md-3"><div class="card shadow-sm p-4"><h5>Berita</h5><p class="fs-3" id="adminTotalBerita">0</p></div></div>
      <div class="col-md-3"><div class="card shadow-sm p-4"><h5>Pengumuman</h5><p class="fs-3" id="adminTotalPengumuman">0</p></div></div>
    </div>

    <div class="card shadow-sm mt-4">
      <div class="card-body">
        <h5>Aktivitas Terbaru</h5>
        <ul id="adminActivityList" class="list-group list-group-flush"></ul>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="../firebase/firebase-config.js"></script>
  <script src="../firebase/auth.js"></script>
  <script src="../firebase/firestore.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    protectAdminRoute();
    loadAdminDashboard();
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut();
      window.location.href = '../login.html';
    });
  </script>
</body>
</html>
