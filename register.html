<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daftar Akun OpenDesa Way Ilahan" />
  <title>Daftar Akun - OpenDesa Way Ilahan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body style="background: linear-gradient(135deg, #f5f7fa 0%, #e8f5e9 100%); min-height: 100vh; display: flex; align-items: center;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0" style="border-radius: 1.5rem; background: rgba(255, 255, 255, 0.98);">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #0b6623 0%, #2c8f3a 100%); border-radius: 1rem; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center;">
                <i class="bi bi-person-plus" style="font-size: 1.8rem; color: white;"></i>
              </div>
              <h3 class="card-title mb-2" style="color: #0b6623; font-weight: 800;">Daftar Akun</h3>
              <p class="text-muted small">OpenDesa Way Ilahan</p>
            </div>
            <p class="text-muted" style="font-size: 0.95rem; margin-bottom: 2rem;">Buat akun untuk mengakses informasi desa secara aman. Akun ini hanya untuk melihat informasi publik.</p>
            <form id="registerForm">
              <div class="mb-3">
                <label for="registerEmail" class="form-label" style="font-weight: 600; color: #1a2332;">Email</label>
                <div class="input-group">
                  <span class="input-group-text" style="border: 2px solid rgba(11, 102, 35, 0.1); background: transparent;">
                    <i class="bi bi-envelope-at" style="color: #0b6623;"></i>
                  </span>
                  <input type="email" id="registerEmail" class="form-control" style="border: 2px solid rgba(11, 102, 35, 0.1);" placeholder="nama@domain.id" required />
                </div>
              </div>
              <div class="mb-3">
                <label for="registerPassword" class="form-label" style="font-weight: 600; color: #1a2332;">Password</label>
                <div class="input-group">
                  <span class="input-group-text" style="border: 2px solid rgba(11, 102, 35, 0.1); background: transparent;">
                    <i class="bi bi-key" style="color: #0b6623;"></i>
                  </span>
                  <input type="password" id="registerPassword" class="form-control" style="border: 2px solid rgba(11, 102, 35, 0.1);" placeholder="Minimal 6 karakter" required />
                </div>
              </div>
              <div class="mb-4">
                <label for="registerConfirmPassword" class="form-label" style="font-weight: 600; color: #1a2332;">Konfirmasi Password</label>
                <div class="input-group">
                  <span class="input-group-text" style="border: 2px solid rgba(11, 102, 35, 0.1); background: transparent;">
                    <i class="bi bi-check-circle" style="color: #0b6623;"></i>
                  </span>
                  <input type="password" id="registerConfirmPassword" class="form-control" style="border: 2px solid rgba(11, 102, 35, 0.1);" placeholder="Ulangi password" required />
                </div>
              </div>
              <button type="submit" class="btn btn-success w-100" style="font-weight: 600; padding: 0.85rem; border-radius: 0.75rem; background: linear-gradient(135deg, #0b6623 0%, #2c8f3a 100%);">Daftar</button>
            </form>
            <div id="registerAlert" class="alert alert-danger mt-3 d-none" role="alert" style="border-radius: 0.75rem; border: 2px solid rgba(239, 68, 68, 0.2);"></div>
            <div class="mt-4 pt-3 text-center" style="border-top: 1px solid rgba(11, 102, 35, 0.1);">
              <p class="small mb-2">Sudah punya akun? <a href="login.html" style="color: #0b6623; font-weight: 600;">Masuk di sini</a></p>
              <a href="index.html" style="color: #6b7280; font-weight: 500; text-decoration: none;">Kembali ke Beranda</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebase/firebase-config.js"></script>
  <script src="firebase/auth.js"></script>
  <script>
    redirectIfAuthenticated();
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('registerConfirmPassword').value;
      const alertBox = document.getElementById('registerAlert');

      alertBox.classList.add('d-none');

      // Basic validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alertBox.textContent = 'Masukkan email yang valid.';
        alertBox.classList.remove('d-none');
        return;
      }
      if (!password || password.length < 6) {
        alertBox.textContent = 'Password minimal 6 karakter.';
        alertBox.classList.remove('d-none');
        return;
      }
      if (password !== confirmPassword) {
        alertBox.textContent = 'Password dan konfirmasi tidak cocok.';
        alertBox.classList.remove('d-none');
        return;
      }

      // Check Firebase config / mock availability
      if (typeof isFirebaseConfigValid === 'function' && !isFirebaseConfigValid() && !window.__FIREBASE_MOCK) {
        alertBox.textContent = 'Layanan auth belum tersedia (Firebase belum dikonfigurasi). Hubungi administrator atau jalankan mode pengembangan.';
        alertBox.classList.remove('d-none');
        return;
      }

      try {
        await signUp(email, password);
        window.location.href = 'index.html';
      } catch (error) {
        if (error && error.code === 'auth/invalid-api-key') {
          alertBox.textContent = 'Firebase belum dikonfigurasi dengan API key yang valid. Gunakan mode mock atau isi konfigurasi Firebase.';
        } else {
          alertBox.textContent = (error && error.message) ? error.message : 'Pendaftaran gagal. Periksa kembali data Anda.';
        }
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
