<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daftar Akun OpenDesa Way Ilahan" />
  <title>Daftar Akun - OpenDesa Way Ilahan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm login-card">
          <div class="card-body">
            <h4 class="card-title mb-3">Daftar Akun Warga</h4>
            <p class="text-muted">Buat akun untuk mengakses informasi desa secara aman. Akun ini hanya untuk melihat informasi publik. Hanya admin yang dapat mengelola data.</p>
            <form id="registerForm">
              <div class="mb-3">
                <label for="registerEmail" class="form-label">Email</label>
                <input type="email" id="registerEmail" class="form-control" placeholder="nama@domain.id" required />
              </div>
              <div class="mb-3">
                <label for="registerPassword" class="form-label">Password</label>
                <input type="password" id="registerPassword" class="form-control" placeholder="Minimal 6 karakter" required />
              </div>
              <div class="mb-3">
                <label for="registerConfirmPassword" class="form-label">Konfirmasi Password</label>
                <input type="password" id="registerConfirmPassword" class="form-control" placeholder="Ulangi password" required />
              </div>
              <button type="submit" class="btn btn-success w-100">Daftar</button>
            </form>
            <div id="registerAlert" class="alert alert-danger mt-3 d-none" role="alert"></div>
            <div class="mt-3 text-center">
              <p class="small mb-1">Sudah punya akun? <a href="login.html">Masuk</a></p>
              <a href="index.html">Kembali ke Beranda</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebase/firebase-config.js"></script>
  <script src="firebase/auth.js"></script>
  <script>
    redirectIfAuthenticated();
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('registerConfirmPassword').value;
      const alertBox = document.getElementById('registerAlert');

      alertBox.classList.add('d-none');
      if (password !== confirmPassword) {
        alertBox.textContent = 'Password dan konfirmasi tidak cocok.';
        alertBox.classList.remove('d-none');
        return;
      }

      try {
        await signUp(email, password);
        window.location.href = 'index.html';
      } catch (error) {
        if (error.code === 'auth/invalid-api-key') {
          alertBox.textContent = 'Firebase belum dikonfigurasi. Periksa file firebase/firebase-config.js dan ganti placeholder dengan API key yang valid.';
        } else {
          alertBox.textContent = error.message || 'Pendaftaran gagal. Periksa kembali data Anda.';
        }
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
