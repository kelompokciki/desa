<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="APBDes Way Ilahan" />
  <title>APBDes - OpenDesa Way Ilahan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.7/css/dataTables.bootstrap5.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">OpenDesa Way Ilahan</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profil</a></li>
          <li class="nav-item"><a class="nav-link active" href="apbdes.html">APBDes</a></li>
          <li class="nav-item"><a class="nav-link" href="berita.html">Berita</a></li>
          <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 bg-light">
    <div class="container">
      <h2>APBDes Way Ilahan</h2>
      <p class="text-muted">Transparansi anggaran desa termasuk pendapatan, belanja, pembiayaan, dan realisasi anggaran.</p>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card shadow-sm p-4">
            <h5>Total Pendapatan</h5>
            <p class="h3 text-success" id="apbdes-pendapatan">Rp0</p>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card shadow-sm p-4">
            <h5>Total Belanja</h5>
            <p class="h3 text-danger" id="apbdes-belanja">Rp0</p>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card shadow-sm p-4">
            <h5>Total Realisasi</h5>
            <p class="h3 text-primary" id="apbdes-realisasi">Rp0</p>
          </div>
        </div>
      </div>
      <div class="mt-4 card shadow-sm p-4">
        <canvas id="apbdesChart" height="180"></canvas>
      </div>
      <div class="mt-4 table-responsive">
        <table id="apbdesTable" class="table table-striped table-bordered" style="width:100%">
          <thead>
            <tr>
              <th>Tahun</th>
              <th>Pendapatan</th>
              <th>Belanja</th>
              <th>Realisasi</th>
            </tr>
          </thead>
          <tbody id="apbdesRows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.7/js/jquery.dataTables.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="assets/js/app.js"></script>

    loadApbdesPage();
  </script>
